version: '3.9'

services:
  postgres:
    image: postgres:15
    container_name: TestePraticoDevCSharp
    environment:
      POSTGRES_DB: vendasdb
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres:/docker-entrypoint-initdb.d
    restart: unless-stopped

volumes:
  pgdata:
